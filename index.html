<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NZF Services Team strategy days, 30 September and 1 October 2026.">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  #storeNote{position:fixed;left:0;right:0;bottom:0;z-index:200;margin:0;padding:9px 16px;
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;
    background:#16233D;color:#E9ECEF;opacity:.94}
</style>
</head>
<body>
<p id="storeNote" hidden></p>
<title>Services Blue Sky Thinking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
/* Grey ground, navy and teal structural, beige for emphasis type only. */
:root{
  --paper:#F1F2F0; --surface:#FFFFFF; --surface-2:#E3E6E2;
  --ink:#16233D; --ink-2:#33405A; --ink-3:#5A6470; --line:#D5D8D3;
  --protect:#1D5A56; --protect-soft:#D9E5E3;
  --prosper:#B58E4E; --prosper-soft:#F0E7D6;
  --focus:#1D5A56; --geo-line:#D9DCD8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111C31; --surface:#18243C; --surface-2:#212E49;
    --ink:#E9ECEF; --ink-2:#AEB8C4; --ink-3:#8C99A8; --line:#2B3B57;
    --protect:#64B8AE; --protect-soft:#143733;
    --prosper:#D6AE68; --prosper-soft:#33280F;
    --focus:#D6AE68; --geo-line:#23304C;
  }
}
:root[data-theme="dark"]{
  --paper:#111C31; --surface:#18243C; --surface-2:#212E49;
  --ink:#E9ECEF; --ink-2:#AEB8C4; --ink-3:#8C99A8; --line:#2B3B57;
  --protect:#64B8AE; --protect-soft:#143733;
  --prosper:#D6AE68; --prosper-soft:#33280F;
  --focus:#D6AE68; --geo-line:#23304C;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.06;text-wrap:balance;margin:0;letter-spacing:-.022em}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:0 auto;padding-block:11px;padding-left:20px;padding-right:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand span{color:var(--protect)}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav a{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink-3);padding:6px 9px;border-radius:5px}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a.on{color:var(--protect);background:var(--protect-soft)}
.navdd{position:relative}
.navdd>button{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 9px;border-radius:5px;background:transparent;border:0;display:flex;align-items:center;gap:5px}
.navdd>button:hover{color:var(--ink);background:var(--surface-2)}
.navdd>button.on{color:var(--protect);background:var(--protect-soft)}
.navdd>button svg{width:9px;height:9px;transition:transform .18s}
.navdd[data-open="1"]>button svg{transform:rotate(180deg)}
.ddpanel{position:absolute;top:calc(100% + 7px);right:0;min-width:262px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:60;box-shadow:0 14px 34px rgba(0,0,0,.14)}
.ddpanel a{display:block;text-decoration:none;padding:9px 11px;border-radius:6px;font-family:var(--display);font-weight:500;font-size:14.5px;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.3}
.ddpanel a:hover{background:var(--surface-2)}
.ddpanel a.on{background:var(--protect-soft);color:var(--protect)}
.ddpanel a small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}
.ddpanel a.on small{color:var(--protect)}
.ddsep{height:1px;background:var(--line);margin:6px 8px}
@media(max-width:620px){.ddpanel{right:auto;left:0;min-width:238px}}

.wrap{max-width:1080px;margin:0 auto;padding-block:0 96px;padding-left:20px;padding-right:20px}
.narrow{max-width:680px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:14px}
.lede{font-size:19px;line-height:1.55;color:var(--ink-2)}
.small{font-size:14.5px;color:var(--ink-3);line-height:1.55}

.hero{padding-block:60px 44px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.geo{position:absolute;top:50%;right:-130px;transform:translateY(-50%);width:min(560px,58vw);pointer-events:none;opacity:.85}
.geo svg{width:100%;height:auto;display:block}
.geo .g-line{fill:none;stroke:var(--geo-line);stroke-width:1}
.geo .g-arc{fill:none;stroke:var(--prosper);stroke-width:1.4;opacity:.55}
.geo .g-dot{fill:var(--protect);opacity:.75}
.hero>*:not(.geo){position:relative;z-index:1}
@media(max-width:860px){.geo{opacity:.4;right:-200px;width:520px}}
.phase{position:relative}
.phase::before{content:"";position:absolute;left:-15px;top:calc(40px + .62em);width:6px;height:6px;border-radius:99px;background:var(--prosper)}
@media(max-width:760px){.phase::before{display:none}}
.hero h1{font-size:clamp(38px,7.4vw,70px);letter-spacing:-.035em;margin-bottom:8px}
.hero h2{font-family:var(--display);font-weight:600;font-size:clamp(23px,4vw,40px);letter-spacing:-.025em;color:var(--protect);margin-bottom:24px}
.datestrip{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:28px}
.datestrip span{background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:5px}
.hero .lede{max-width:620px}
.quickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:38px}
.quick{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:17px 18px;transition:border-color .15s,transform .15s}
.quick:hover{border-color:var(--protect);transform:translateY(-2px)}
.quick strong{font-family:var(--display);font-weight:600;font-size:17px;display:block;margin-bottom:3px}
.quick span{font-size:14px;color:var(--ink-3);line-height:1.45}
.framing{padding-block:48px;border-bottom:1px solid var(--line)}
.framing p+p{margin-top:17px}
.pullquote{font-family:var(--display);font-weight:600;font-size:clamp(21px,3.4vw,27px);line-height:1.25;border-left:3px solid var(--prosper);padding-left:20px;margin:30px 0;text-wrap:balance}

.daycard{margin-top:34px}
.dayhead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;padding-bottom:11px;border-bottom:2px solid var(--ink)}
.dayhead h3{font-size:25px;letter-spacing:-.02em}
.dayhead .small{margin-left:auto}
.slot{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:start;padding-block:15px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
a.slot:hover{background:var(--surface-2)}
.slot-time{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.slot-title{font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.28}
.slot-lead{font-size:14px;color:var(--ink-3);margin-top:3px}
.slot-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;white-space:nowrap;align-self:center}
.tag-ready{background:var(--protect-soft);color:var(--protect)}
.tag-open{background:var(--prosper-soft);color:var(--prosper)}
.tag-blank{background:var(--surface-2);color:var(--ink-3)}
.slot.break{opacity:.62}
.slot.break .slot-title{font-family:var(--body);font-weight:400;font-size:15.5px;color:var(--ink-3)}
@media(max-width:620px){.slot{grid-template-columns:76px 1fr;gap:13px}.slot-tag{grid-column:2;justify-self:start;margin-top:7px;align-self:start}}

.sesshead{padding-block:46px 26px;border-bottom:1px solid var(--line)}
.sesshead h1{font-size:clamp(31px,5.6vw,50px);letter-spacing:-.03em;margin-bottom:16px}
.meta{display:flex;gap:9px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-bottom:22px}
.meta span{background:var(--surface);border:1px solid var(--line);padding:4px 9px;border-radius:5px}
.modebar{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:11px 17px;border-radius:7px;text-decoration:none;display:inline-block}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}

.readblock{padding-block:34px;border-bottom:1px solid var(--line)}
.readblock:last-child{border-bottom:0}
.beatnum{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:9px}
.beathead{font-family:var(--display);font-weight:700;font-size:clamp(23px,3.9vw,33px);letter-spacing:-.025em;line-height:1.14;margin-bottom:15px}
.readblock p{max-width:64ch}
.readblock p+p{margin-top:15px}
.phase{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--prosper);padding-top:40px;display:block}

.wheelwrap{margin:26px 0;max-width:520px}
.wheelwrap svg{width:100%;height:auto;max-width:100%;display:block}
.wnode circle{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:stroke .3s,fill .3s}
.wnode text{font-family:var(--mono);font-size:15px;fill:var(--ink-3);transition:fill .3s}
.wnode.lit circle{stroke-width:2.5}
.wnode.lit.p circle{fill:var(--protect-soft);stroke:var(--protect)}
.wnode.lit.p text{fill:var(--protect)}
.wnode.lit.r circle{fill:var(--prosper-soft);stroke:var(--prosper)}
.wnode.lit.r text{fill:var(--prosper)}
.wlabel{font-family:var(--display);font-weight:600;font-size:15px;fill:var(--ink-3);transition:fill .3s}
.wlabel.lit{fill:var(--ink)}
.warc{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .3s}

.interact{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:22px;margin:26px 0}
.prompt{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.9vw,23px);line-height:1.3;color:var(--ink);margin-bottom:16px;text-wrap:balance}
.respond{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.respond textarea{flex:1 1 260px;min-width:0;font-family:var(--body);font-size:16px;line-height:1.45;padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);resize:vertical;min-height:76px}
.respond textarea::placeholder{color:var(--ink-3)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--protect);border-radius:7px;padding:13px 15px;font-size:15.5px;line-height:1.45}
.card.r{border-left-color:var(--prosper)}
.empty{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);border:1px dashed var(--line);border-radius:7px;padding:20px;text-align:center}
.counter{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:11px;display:block}

/* spectrum */
.specrow{padding-block:15px;border-top:1px solid var(--line)}
.specrow:first-of-type{border-top:0}
.specname{font-family:var(--display);font-weight:600;font-size:16.5px;margin-bottom:9px}
.specscale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.specscale button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:11px 4px 8px;color:var(--ink-3);font-family:var(--mono);font-size:12px;position:relative;overflow:hidden}
.specscale button:hover{border-color:var(--protect)}
.specscale button.picked{border-color:var(--protect);color:var(--protect);background:var(--protect-soft)}
.specscale button i{position:absolute;left:0;bottom:0;width:100%;background:var(--protect);opacity:.22;display:block;transition:height .35s}
.specends{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.specends span:last-child{text-align:right}

/* allocate */
.alloc{padding-block:15px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 128px;gap:16px;align-items:start}
.alloc:first-of-type{border-top:0}
.alloc h5{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0 0 4px}
.alloc p{font-size:14.5px;color:var(--ink-3);line-height:1.5}
.alloc input{width:100%;font-family:var(--mono);font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);text-align:right}
.allocmean{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:5px;display:block;text-align:right}
.alloctotal{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12.5px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line);flex-wrap:wrap}
.alloctotal b{font-weight:500}
.over{color:var(--prosper)}
@media(max-width:560px){.alloc{grid-template-columns:1fr}}

/* ladder */
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.ladder.flat{flex-direction:column}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 15px;text-align:left;color:var(--ink);position:relative;overflow:hidden}
.rung:hover{border-color:var(--protect)}
.rung.picked{border-color:var(--protect);background:var(--protect-soft)}
.rung b{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:500}
.rung strong{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.rung em{font-style:normal;font-size:14px;color:var(--ink-3);display:block;margin-top:2px;line-height:1.45}
.rung .rlab{z-index:1}
.rung .rcnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;z-index:1}
.rung i{position:absolute;left:0;top:0;height:100%;background:var(--protect);opacity:.13;display:block;transition:width .35s}

/* the golden thread */
.thread{position:relative;padding-left:32px;margin:24px 0;max-width:760px}
.thread::before{content:"";position:absolute;left:10px;top:26px;bottom:38px;width:2px;background:var(--prosper);opacity:.85}
.tier{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:10px}
.tier::before{content:"";position:absolute;left:-27px;top:22px;width:12px;height:12px;border-radius:99px;background:var(--prosper);box-shadow:0 0 0 3px var(--paper)}
.tier h5{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 5px}
.tname{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.015em}
.ttag{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--prosper-soft);color:var(--prosper);padding:2px 7px;border-radius:99px}
.tnum{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.tshape{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--ink-3);margin-bottom:7px}
.tdoes{font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink-2)}
.tentry{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--prosper);padding-top:4px}
.present .thread{max-width:860px;width:100%;margin:14px 0 0}
.present .tdoes{font-size:clamp(14px,1.35vw,18px)}
.present .tname{font-size:clamp(16px,1.6vw,22px)}

/* the Yusuf sequence */
.storyframe{display:grid;grid-template-columns:1fr;gap:6px;align-content:center;max-width:none}
.styear{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:.92;color:var(--prosper);font-size:clamp(46px,9vw,124px)}
.stlabel{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:block}
.sttxt{font-family:var(--body);max-width:34ch}
.sttxt p{font-size:clamp(16.5px,1.75vw,25px);line-height:1.38;color:var(--ink)}
.sttxt p+p{margin-top:14px}
.stpayoff{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.06;font-size:clamp(30px,5.4vw,66px);max-width:20ch;text-wrap:balance}
.stpayoff b{font-weight:700;color:var(--prosper)}
@media(min-width:940px){
  .storyframe{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:clamp(34px,6vw,86px);align-items:center}
}
.strail{margin-top:30px;grid-column:1/-1}
.strail svg{width:100%;height:auto;display:block;max-width:760px}
.strail .rl{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.rl-done{stroke:var(--protect);stroke-width:2;stroke-linecap:round}
.rl-tick{fill:var(--ink-3);font-family:var(--mono);font-size:11px}
.rl-dot{fill:var(--prosper)}
.stfade{animation:stIn .5s ease-out both}
@keyframes stIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.stfade{animation:none}}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.compare{grid-template-columns:1fr}}
.compare h5{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:0 0 10px}

.present{--paper:#111C31;--surface:#18243C;--surface-2:#212E49;--ink:#E9ECEF;--ink-2:#AEB8C4;--ink-3:#8C99A8;--line:#2B3B57;--protect:#64B8AE;--protect-soft:#143733;--prosper:#D6AE68;--prosper-soft:#33280F;--geo-line:#23304C;position:fixed;inset:0;z-index:100;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.present-stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,6vw,84px)}
.present-stage .eyebrow{font-size:13px;margin-bottom:22px}
.pbig{font-family:var(--display);font-weight:700;letter-spacing:-.032em;line-height:1.04;font-size:clamp(34px,6.4vw,82px);text-wrap:balance}
.pbig em{font-style:normal;color:var(--protect)}
.pbig b{font-weight:700;color:var(--prosper)}
.pmid{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.18;font-size:clamp(23px,3.5vw,44px);text-wrap:balance}
.psub{font-size:clamp(17px,1.9vw,25px);line-height:1.45;color:var(--ink-2);margin-top:26px;max-width:38ch}
.plist{margin-top:30px;display:flex;flex-direction:column;gap:13px;max-width:46ch}
.plist div{display:flex;gap:14px;align-items:flex-start;font-size:clamp(16px,1.7vw,22px);line-height:1.36}
.plist b{font-family:var(--mono);font-weight:500;color:var(--prosper);font-size:.82em;padding-top:.22em}

/* ---- supabase ---- */
function initSupabase(){
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
  s.onload=async function(){
    try{
      var sb=window.supabase.createClient(STORE.supabase.url, STORE.supabase.anonKey);
      await sb.auth.signInAnonymously();
      STORE.client=sb; noteStore("");

      async function pullWalls(){
        var r=await sb.from("submissions").select("block,text,at").order("at",{ascending:false});
        if(r.error) return;
        allWallBlocks().forEach(function(b){ WALLS[b]=[]; });
        (r.data||[]).forEach(function(row){
          WALLS[row.block]=WALLS[row.block]||[];
          WALLS[row.block].push({text:row.text||"",at:row.at||0});
        });
        allWallBlocks().forEach(paintWall);
      }
      async function pullPicks(){
        var r=await sb.from("picks").select("exercise,payload");
        if(r.error) return;
        allExercises().forEach(function(e){ PICKS[e]=[]; });
        (r.data||[]).forEach(function(row){
          PICKS[row.exercise]=PICKS[row.exercise]||[];
          PICKS[row.exercise].push(row.payload||{});
        });
        allExercises().forEach(paintExercise);
      }
      await pullWalls(); await pullPicks();

      sb.channel("bstd")
        .on("postgres_changes",{event:"*",schema:"public",table:"submissions"},pullWalls)
        .on("postgres_changes",{event:"*",schema:"public",table:"picks"},pullPicks)
        .subscribe();
    }catch(e){
      console.error("[store]",e);
      noteStore("Response store error: "+(e&&e.message?e.message:"unknown")+" — the site still works.");
    }
  };
  s.onerror=function(){ noteStore("Could not load the response store. The site still works."); };
  document.head.appendChild(s);
}

/* ---- jsonbin ---- */
function jbUrl(){ return "https://api.jsonbin.io/v3/b/"+STORE.jsonbin.binId; }
function jbHeaders(){ return {"Content-Type":"application/json","X-Access-Key":STORE.jsonbin.accessKey}; }

async function jbRead(){
  var r=await fetch(jbUrl()+"/latest",{headers:jbHeaders()});
  if(!r.ok) throw new Error("read failed");
  var j=await r.json(), rec=j.record||{};
  return {submissions:rec.submissions||[], picks:rec.picks||{}};
}
async function jbWrite(state){
  var r=await fetch(jbUrl(),{method:"PUT",headers:jbHeaders(),body:JSON.stringify(state)});
  if(!r.ok) throw new Error("write failed");
}
function jbApply(state){
  allWallBlocks().forEach(function(b){ WALLS[b]=[]; });
  (state.submissions||[]).forEach(function(s){
    WALLS[s.block]=WALLS[s.block]||[]; WALLS[s.block].push({text:s.text,at:s.at});
  });
  allWallBlocks().forEach(function(b){ (WALLS[b]||[]).sort(function(a,c){return c.at-a.at;}); paintWall(b); });
  allExercises().forEach(function(e){ PICKS[e]=[]; });
  Object.keys(state.picks||{}).forEach(function(k){
    var p=state.picks[k];
    PICKS[p.exercise]=PICKS[p.exercise]||[]; PICKS[p.exercise].push(p.values||{});
  });
  allExercises().forEach(paintExercise);
}
async function initJsonbin(){
  try{
    jbApply(await jbRead()); noteStore("");
    if(WALL_SCREEN){
      setInterval(async function(){ try{ jbApply(await jbRead()); }catch(e){} },
                  Math.max(3000, STORE.jsonbin.pollMs));
    }
  }catch(e){ noteStore("Could not reach the response store. The site still works."); }
}
/* read, append, write, then re-read and confirm it landed. Retries because a
   whole-bin write can be overwritten by someone submitting at the same moment. */
async function jbCommit(mutate, verify){
  for(var attempt=0; attempt<4; attempt++){
    try{
      var state=await jbRead();
      mutate(state);
      await jbWrite(state);
      var after=await jbRead();
      jbApply(after);
      if(verify(after)) return true;
    }catch(e){}
    await new Promise(function(r){ setTimeout(r, 250 + Math.random()*600); });
  }
  return false;
}

(function initStore(){
  if(STORE.mode==="supabase" && STORE.supabase.url) return initSupabase();
  if(STORE.mode==="jsonbin"  && STORE.jsonbin.binId) return initJsonbin();
  return initNone();
})();

async function sendWall(block,text){
  var clean=String(text||"").trim().slice(0,600);
  if(!clean) return false;
  var stamp=Date.now();

  if(STORE.mode==="supabase" && STORE.client){
    var r=await STORE.client.from("submissions").insert({block:block,text:clean,at:stamp});
    if(r.error){ console.error("[store] insert failed",r.error); noteStore("Could not send: "+r.error.message); }
    return !r.error;
  }
  if(STORE.mode==="jsonbin" && STORE.jsonbin.binId){
    var mark=CLIENT_ID+"-"+stamp;
    return await jbCommit(
      function(st){ st.submissions.push({id:mark,block:block,text:clean,at:stamp}); },
      function(st){ return (st.submissions||[]).some(function(s){ return s.id===mark; }); }
    );
  }
  WALLS[block]=WALLS[block]||[];
  WALLS[block].unshift({text:clean,at:stamp});
  paintWall(block);
  return true;
}

async function savePick(exercise,values){
  var stamp=Date.now(), key=exercise+"__"+CLIENT_ID;

  if(STORE.mode==="supabase" && STORE.client){
    var r=await STORE.client.from("picks").upsert({id:key,exercise:exercise,payload:values,at:stamp});
    if(r.error){ console.error("[store] upsert failed",r.error); noteStore("Could not send: "+r.error.message); }
    return !r.error;
  }
  if(STORE.mode==="jsonbin" && STORE.jsonbin.binId){
    return await jbCommit(
      function(st){ st.picks=st.picks||{}; st.picks[key]={exercise:exercise,values:values,at:stamp}; },
      function(st){ return !!(st.picks&&st.picks[key]); }
    );
  }
  PICKS[exercise]=[values];
  paintExercise(exercise);
  return true;
}

/* ---------- painters ---------- */
function paintWall(block){
  var list=WALLS[block]||[];
  document.querySelectorAll('[data-wall="'+block+'"]').forEach(function(el){
    var tone=el.getAttribute("data-tone")==="r"?" r":"";
    el.innerHTML = list.length
      ? list.map(function(s){return '<div class="card'+tone+'">'+esc(s.text)+'</div>';}).join("")
      : '<div class="empty">'+((typeof WALL_SCREEN!=="undefined"&&!WALL_SCREEN&&STORE.mode==="jsonbin")?'Responses are showing on the main screen.':'Nothing yet. Responses appear here live.')+'</div>';
  });
  document.querySelectorAll('[data-count="'+block+'"]').forEach(function(el){
    var n=list.length; el.textContent = n===1?"1 response":n+" responses";
  });
}

function paintExercise(ex){
  var rows=PICKS[ex]||[];
  var mine=localPick(ex);

  document.querySelectorAll('[data-spec="'+ex+'"]').forEach(function(root){
    root.querySelectorAll("[data-item]").forEach(function(rowEl){
      var item=rowEl.getAttribute("data-item");
      var counts=[0,0,0,0,0], n=0;
      rows.forEach(function(r){ var v=r[item]; if(v>=1&&v<=5){counts[v-1]++;n++;} });
      rowEl.querySelectorAll("button").forEach(function(btn,idx){
        var pct = n ? Math.round((counts[idx]/n)*100) : 0;
        var bar = btn.querySelector("i");
        if(bar) bar.style.height = pct + "%";
        btn.classList.toggle("picked", mine[item] === (idx+1));
      });
    });
    var c=root.querySelector("[data-exn]");
    if(c) c.textContent = rows.length===1 ? "1 person answered" : rows.length+" people answered";
  });

  document.querySelectorAll('[data-alloc="'+ex+'"]').forEach(function(root){
    root.querySelectorAll("[data-case]").forEach(function(wrapEl){
      var id=wrapEl.getAttribute("data-case");
      var sum=0,n=0;
      rows.forEach(function(r){ var v=Number(r[id]); if(!isNaN(v)){sum+=v;n++;} });
      var m=wrapEl.querySelector(".allocmean");
      if(m) m.textContent = n ? ("room average £"+Math.round(sum/n).toLocaleString()) : "no answers yet";
    });
    var c=root.querySelector("[data-exn]");
    if(c) c.textContent = rows.length===1 ? "1 person answered" : rows.length+" people answered";
  });

  document.querySelectorAll('[data-ladder="'+ex+'"]').forEach(function(root){
    var counts={},n=0;
    rows.forEach(function(r){ var v=r.rung; if(v){counts[v]=(counts[v]||0)+1;n++;} });
    root.querySelectorAll("[data-rung]").forEach(function(btn){
      var id=btn.getAttribute("data-rung");
      var k=counts[id]||0;
      var pct=n?Math.round((k/n)*100):0;
      var bar=btn.querySelector("i"); if(bar) bar.style.width=pct+"%";
      var lab=btn.querySelector("[data-cnt]"); if(lab) lab.textContent = n ? (k+" · "+pct+"%") : "";
      btn.classList.toggle("picked", mine.rung===id);
    });
    var c=root.querySelector("[data-exn]");
    if(c) c.textContent = n===1 ? "1 person answered" : n+" people answered";
  });
}

function storyRail(pos){
  var W=760,x0=30,x1=W-30,y=26;
  var marks=[[0,"2026"],[0.58,"2036"],[0.80,"2038"],[1,"and on"]];
  var px=x0+(x1-x0)*pos;
  var o='<svg viewBox="0 0 '+W+' 56" aria-hidden="true">';
  o+='<line class="rl" x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/>';
  o+='<line class="rl-done" x1="'+x0+'" y1="'+y+'" x2="'+px.toFixed(1)+'" y2="'+y+'"/>';
  marks.forEach(function(m){
    var mx=x0+(x1-x0)*m[0];
    o+='<line class="'+(m[0]<=pos?"rl-done":"rl")+'" x1="'+mx.toFixed(1)+'" y1="'+(y-6)+'" x2="'+mx.toFixed(1)+'" y2="'+(y+6)+'"/>';
    o+='<text class="rl-tick" x="'+mx.toFixed(1)+'" y="'+(y+24)+'" text-anchor="'+(m[0]===0?"start":(m[0]===1?"end":"middle"))+'">'+m[1]+'</text>';
  });
  o+='<circle class="rl-dot" cx="'+px.toFixed(1)+'" cy="'+y+'" r="6"/>';

}

/* ---------- compass construction motif ---------- */
function geoSvg(){
  var cx=300,cy=300,R=250;
  var o='<svg viewBox="0 0 600 600" aria-hidden="true">';
  // the generating circle and its subdivisions, drawn as working lines
  o+='<circle class="g-line" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
  o+='<circle class="g-line" cx="'+cx+'" cy="'+cy+'" r="'+(R*0.62).toFixed(1)+'"/>';
  o+='<circle class="g-line" cx="'+cx+'" cy="'+cy+'" r="'+(R*0.28).toFixed(1)+'"/>';
  // twelve division points, radial working lines, and the pentad the flywheel uses
  var i,a,x,y;
  for(i=0;i<12;i++){
    a=(i*30-90)*Math.PI/180;
    x=cx+R*Math.cos(a); y=cy+R*Math.sin(a);
    o+='<line class="g-line" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
  }
  // chords joining every fourth point: the star that falls out of a divided circle
  for(i=0;i<12;i++){
    a=(i*30-90)*Math.PI/180; var b=(((i+5)%12)*30-90)*Math.PI/180;
    o+='<line class="g-line" x1="'+(cx+R*Math.cos(a)).toFixed(1)+'" y1="'+(cy+R*Math.sin(a)).toFixed(1)+
       '" x2="'+(cx+R*Math.cos(b)).toFixed(1)+'" y2="'+(cy+R*Math.sin(b)).toFixed(1)+'"/>';
  }
  // the five flywheel stations sitting on the same construction
  for(i=0;i<5;i++){
    a=(i*72-90)*Math.PI/180;
    x=cx+R*0.62*Math.cos(a); y=cy+R*0.62*Math.sin(a);
    o+='<circle class="g-dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5"/>';
  }
  // one gold arc, the turn
  o+='<path class="g-arc" d="M '+(cx+R*0.82).toFixed(1)+' '+cy+' A '+(R*0.82).toFixed(1)+' '+(R*0.82).toFixed(1)+
     ' 0 1 1 '+(cx-R*0.82*0.5).toFixed(1)+' '+(cy-R*0.82*0.866).toFixed(1)+'"/>';
  return o+'</svg>';
}

/* ---------- flywheel ---------- */
function wheelSvg(stage){
  var cx=240,cy=200,r=125;
  var angs=[-90,-18,54,126,198];
  var arcs=[[-76,-32],[-4,40],[68,112],[140,184],[212,256]];
  function pt(a,rad){var t=a*Math.PI/180;return [cx+rad*Math.cos(t),cy+rad*Math.sin(t)];}
  var out='<svg viewBox="0 0 480 400" role="img" aria-label="The flywheel: prosperity, protection, confidence, enterprise, strength">';
  out+='<defs>'+
    '<marker id="ahOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">'+
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--protect)"/></marker>'+
    '<marker id="ahOff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">'+
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker>'+
  '</defs>';
  // construction: the generating circle, its centre, and the radii that place the five stations
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--geo-line)" stroke-width="1"/>';
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--geo-line)"/>';
  angs.forEach(function(a){
    var e=pt(a,r);
    out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--geo-line)" stroke-width="1"/>';
  });
  // the pentagon those five points describe
  out+='<polygon points="'+angs.map(function(a){var q=pt(a,r);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(" ")+
       '" fill="none" stroke="var(--geo-line)" stroke-width="1"/>';
  arcs.forEach(function(a,i){
    var s=pt(a[0],r),e=pt(a[1],r);
    var lit=(i+1)<stage;
    out+='<path class="warc" d="M '+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A '+r+' '+r+' 0 0 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+
         '" marker-end="url(#'+(lit?"ahOn":"ahOff")+')" style="stroke:'+(lit?"var(--protect)":"var(--line)")+'"/>';
  });
  angs.forEach(function(a,i){
    var p=pt(a,r),lp=pt(a,r+46);
    var lit=(i+1)<=stage;
    var anchor=Math.abs(Math.cos(a*Math.PI/180))<0.3?"middle":(Math.cos(a*Math.PI/180)>0?"start":"end");
    out+='<g class="wnode '+WHEEL[i].tone+(lit?" lit":"")+'"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="27"/>'+
         '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+5).toFixed(1)+'" text-anchor="middle">'+(i+1)+'</text></g>';
    out+='<text class="wlabel'+(lit?" lit":"")+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" text-anchor="'+anchor+'">'+WHEEL[i].short+'</text>';
  });
  return out+'</svg>';
}

    "Most Zakat organisations exist to relieve need. Somebody is struggling, we assess, we pay, they are caught. It is necessary work, it is well within the letter and spirit of Zakat, and this organisation has spent years getting good at it.",
    "But a safety net catches. It does not lift. The person helped this year is very often the person who needs help again in three years, because the payment addressed the emergency and nothing about the conditions that produced it. Measured over a decade rather than a quarter, a great deal of relief spending produces no movement at all.",
    "There is a second problem underneath that one. We treat poverty as something that happens to individuals, so we assess individuals, one file at a time. Every one of those decisions is defensible on its own. The aggregate is still weak, because resilience does not sit inside a household. It sits in the network around it. A family lifted inside a community that cannot catch anybody is one bad month from where it started."
  ])+

  sec("02 · THE AIM","Community mobility, not individual relief",[
    "The aim is to drive the socioeconomic mobility of the British Muslim community as a whole, and the mechanism is the community itself.",
    "Saying it at community scale rather than household scale changes what counts as success. The question stops being how many people we helped this year and becomes whether the community is moving. Those produce very different decisions about who to fund, what to measure, and when to stop."
  ])+

  sec("03 · THE BET","Protection is what makes ambition possible",[
    "Here is the reframe the whole model depends on, and it is worth sitting with because it runs against how the sector usually talks.",
    "A safety net is normally described as a cushion, something that softens a fall. Think of it instead as a springboard. When people know they will not hit the floor, they behave differently before anything has gone wrong. They retrain. They leave the safe job for the one with a higher ceiling. They start the business they have been thinking about for four years. They back themselves, because the downside has a limit.",
    "So the sector frames Zakat around need. This frames it around risk. A protected community is not a comfortable community, it is an ambitious one, and ambition is the thing that compounds over ten years."
  ])+

  '<section class="readblock narrow"><div class="beatnum">04 · THE MECHANISM</div>'+
  '<div class="beathead">The flywheel</div>'+
  '<div class="wheelwrap">'+wheelSvg(5)+'</div>'+
  '<p style="margin-top:15px">A prosperous community has something to spare, which lets it catch its own when they fall. Being caught is not really the benefit. Knowing you would be caught is the benefit, because that is what frees people to take risks. Those risks build enterprise, enterprise makes the community stronger, and a stronger community can catch more people, which frees more people to rise.</p>'+
  '<p style="margin-top:15px">Protection and prosperity feed each other, and the wheel turns faster the longer it runs. The hard part is not the physics of it, it is the first push.</p>'+
  '</section>'+

  sec("05 · THE FUND","Making the wheel physical",[
    "The flywheel is a mechanism. The fund is what makes it physical: a communal pot the community pays into and draws from, all of it zakat.",
    "Early on, in a place with high chronic need, it behaves like a safety net. It catches people, quickly and close to home, without the form and the stranger and the decision made about you. High volume, low value.",
    "As the community strengthens and giving grows, and as chronic need falls away into occasional shocks, the same fund does something different: fewer, larger, transformational investments instead of many small relief payments.",
    "It is one fund that changes character as the place it serves changes, not a separate pot switched on later. That distinction matters more than it sounds, because a second pot would need somebody to decide to open it. This needs only the community to get stronger.",
    "Whether it is one national pot, or a national standard with local federated funds under it, is still open. It is probably the single biggest design decision in the whole model."
  ])+

  '<section class="readblock narrow"><div class="beatnum">06 · THE GOLDEN THREAD</div>'+
  '<div class="beathead">Three tiers, all zakat funded</div>'+
  '<p>This is what stitches the fund to the day to day. People enter at whichever tier fits their need rather than starting at the bottom and working up.</p>'+
  cTiers()+
  '<p style="margin-top:15px">The full journey through all three, the way Yusuf travels it, is the model working end to end. It is not the average case. Most people will need one tier, some will need two, and the point is that the route exists at all.</p>'+
  '<p style="margin-top:15px">What actually moves someone from one tier to the next is, at the moment, a judgement call based on need rather than a formal trigger. What that becomes, and what each tier asks of programmes, quality and impact, customer service and technology, is the next layer of thinking rather than this one.</p>'+
  '</section>'+

  sec("07 · THE CROSSOVER","The same fund, doing something bigger",[
    "Then comes the shift that makes this different from simply doing relief better.",
    "As a community strengthens, the shape of its need changes. Chronic hardship, the permanent floor problem that absorbs almost everything, gives way to one-off crisis: a job lost, an illness, a sudden bill. That is a far lighter load to carry, and carrying it releases capacity.",
    "At that crossover the same fund starts doing something bigger. Fewer, larger, transformational investments. Enterprise. Skills. Youth. Springboards that do not just catch people but launch them.",
    "This is the part worth understanding properly, because it is what makes the model self-sequencing. In most organisations relief versus empowerment is a permanent internal argument, settled by whoever holds the budget that year and reopened the next. Here nobody has to win it. While chronic need is high the money sits in relief, because that is what the need demands. As need falls, the same rule moves the money up the ladder. The community's own progress decides."
  ])+

  sec("08 · OUR ROLE","Catalyst, not cornerstone",[
    "NZF starts the wheel. It does not have to be the wheel.",
    "That means three things in practice. Deliver the net and seed the fund, so there is something to start with. Set one national standard, so that being caught does not depend on your postcode. And build on the grassroots infrastructure that already exists in these communities rather than duplicating it, which means national coherence with local ownership.",
    "And then step back, and go to the places where the wheel has not started turning yet."
  ])+

  sec("09 · THE MEASURE","Success is being needed less",[
    "Almost no charity will say this out loud, because the incentives forbid it. Reach is the standard proxy for success, and it quietly rewards permanent dependence: the more people who need you, the better you appear to be doing.",
    "If this model works, the opposite happens. Communities graduate off support. Our presence in the strongest places thins out. The honest measure is not how many people we caught this year, it is how many places no longer need us to."
  ])+

  sec("10 · WHAT ISN'T SETTLED","Five open questions",[
    "This is a concept rather than a plan. It is meant to show a direction and be built on, not signed off. Five things it rests on are not yet answered, and they are the best places to push on Wednesday.",
    "The engine. The model assumes giving rises as people see impact. That assumption carries the entire flywheel and currently rests on reasoning rather than data. If it is wrong, the wheel does not turn on its own.",
    "The fund's shape. One national pot, or a national standard with local federated funds beneath it. Consistency and scale on one side, ownership and speed on the other.",
    "The tier trigger. What actually moves someone from emergency to stabilisation to empowerment. Judgement, or a marker.",
    "Zakat eligibility. How this stays inside it as people move from receiving to contributing. This is the question most likely to decide whether the whole thing is credible, and it has not been worked through.",
    "Needed less. Do we mean it operationally, with real communities graduating off support and a centre that shrinks in those places, or is it a figure of speech? Those are two very different organisations in 2036.",
    "There is a sixth worth noting, which is the starting push. What exactly does NZF inject into a community with no surplus to get the wheel moving. Money is the obvious answer and probably not the whole one."
  ]);
}

var pKey="vision", pIndex=0, pOpen=false;

function presentFrame(i){
  var beats=SESSIONS[pKey].beats, b=beats[i];
  if(b.kind==="story"){
    var so='<div class="present-stage">'+cStory(b,true)+'</div>';
    return so+presentBar(i,beats,b);
  }
  var isWheel=b.kind==="wheel";
  var out='<div class="present-stage'+(isWheel?" wheelframe":"")+'">';
  if(isWheel){
    out+='<div class="textcol"><span class="eyebrow">The mechanism · stage '+b.stage+' of 5</span>'+
         '<div class="pbig" style="font-size:clamp(28px,4.4vw,56px)">'+esc(WHEEL[b.stage-1].full)+'</div></div>'+
         '<div class="wheelcol"><div class="wheelwrap">'+wheelSvg(b.stage)+'</div></div>';
  }
  if(b.eyebrow&&!isWheel) out+='<span class="eyebrow">'+esc(b.eyebrow)+'</span>';
  if(b.big) out+='<div class="pbig">'+b.big+'</div>';
  if(b.mid&&!b.big) out+='<div class="pmid">'+esc(b.mid)+'</div>';
  if(b.list) out+='<div class="plist">'+b.list.map(function(l){return '<div><b>'+esc(l[0])+'</b><span>'+esc(l[1])+'</span></div>';}).join("")+'</div>';
  if(b.sub) out+='<p class="psub">'+esc(b.sub)+'</p>';
  out+=component(b);
  out+='</div>';
  return out+presentBar(i,beats,b);
}

function presentBar(i,beats,b){
  var dots=beats.map(function(_,k){return '<i class="'+(k===i?"here":(k<i?"on":""))+'"></i>';}).join("");
  return '<div class="present-bar">'+
    '<button class="pnav" id="pPrev" '+(i===0?"disabled":"")+' aria-label="Previous">&#8592;</button>'+
    '<button class="pnav" id="pNext" '+(i===beats.length-1?"disabled":"")+' aria-label="Next">&#8594;</button>'+
    '<span class="pcount">'+(i+1)+' / '+beats.length+'</span>'+
    '<span class="pdots">'+dots+'</span>'+
    '<span class="ptitle">'+esc(b.phase||"")+'</span>'+
    '<button class="pexit" id="pExit">Exit</button></div>';
}

function renderPresent(){
  var root=document.getElementById("presentRoot");
  root.innerHTML='<div class="present">'+presentFrame(pIndex)+'</div>';
  bind(root); paintAll();
  document.getElementById("pPrev").onclick=function(){ if(pIndex>0){pIndex--;renderPresent();} };
  document.getElementById("pNext").onclick=function(){ if(pIndex<SESSIONS[pKey].beats.length-1){pIndex++;renderPresent();} };
  document.getElementById("pExit").onclick=closePresent;
}
function openPresent(key){ pKey=key; pOpen=true; pIndex=0; document.body.style.overflow="hidden"; renderPresent(); }
function closePresent(){ pOpen=false; document.body.style.overflow=""; document.getElementById("presentRoot").innerHTML=""; }

document.addEventListener("keydown",function(e){
  if(!pOpen) return;
  var tag=(e.target&&e.target.tagName)||"";
  if(tag==="TEXTAREA"||tag==="INPUT") return;
  var n=SESSIONS[pKey].beats.length;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ if(pIndex<n-1){pIndex++;renderPresent();} e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ if(pIndex>0){pIndex--;renderPresent();} e.preventDefault(); }
  else if(e.key==="Escape"){ closePresent(); }
});

/* ==========================================================
   binding
   ========================================================== */
function bind(scope){
  scope.querySelectorAll("[data-send]").forEach(function(btn){
    btn.onclick=async function(){
      var block=btn.getAttribute("data-send");
      var ta=scope.querySelector("#ta-"+block);
      if(!ta||!ta.value.trim()) return;
      var orig=btn.textContent; btn.textContent="Sending";
      var ok=await sendWall(block,ta.value);
      if(ok){ ta.value=""; btn.textContent="Sent"; } else { btn.textContent="Not sent"; }
      setTimeout(function(){btn.textContent=orig;},1400);
    };
  });

  scope.querySelectorAll("[data-set]").forEach(function(btn){
    btn.onclick=async function(){
      var p=btn.getAttribute("data-set").split("|");
      var ex=p[0], item=p[1], val=Number(p[2]);
      var mine=localPick(ex); mine[item]=val; setLocalPick(ex,mine);
      paintExercise(ex);
      await savePick(ex,mine);
    };
  });

  scope.querySelectorAll("[data-allocsave]").forEach(function(btn){
    btn.onclick=async function(){
      var p=btn.getAttribute("data-allocsave").split("|");
      var ex=p[0];
      var mine={};
      scope.querySelectorAll('[data-alloc-in^="'+ex+'|"]').forEach(function(inp){
        var id=inp.getAttribute("data-alloc-in").split("|")[1];
        var v=Number(inp.value); if(!isNaN(v)&&v>0) mine[id]=v;
      });
      setLocalPick(ex,mine);
      var orig=btn.textContent; btn.textContent="Sending";
      var ok=await savePick(ex,mine);
      btn.textContent = ok ? "Submitted" : "Not sent";
      setTimeout(function(){btn.textContent=orig;},1600);
    };
  });

  scope.querySelectorAll("[data-alloc-in]").forEach(function(inp){
    var ex=inp.getAttribute("data-alloc-in").split("|")[0];
    var saved=localPick(ex);
    var id=inp.getAttribute("data-alloc-in").split("|")[1];
    if(saved[id]) inp.value=saved[id];
    inp.oninput=function(){
      var tot=0;
      scope.querySelectorAll('[data-alloc-in^="'+ex+'|"]').forEach(function(x){
        var v=Number(x.value); if(!isNaN(v)) tot+=v;
      });
      var el=scope.querySelector('[data-alloctot="'+ex+'"]');
      if(el){
        var pot=Number((scope.querySelector('[data-allocsave^="'+ex+'|"]')||{getAttribute:function(){return ex+"|0";}}).getAttribute("data-allocsave").split("|")[1]);
        el.textContent="Allocated £"+tot.toLocaleString()+" of £"+pot.toLocaleString();
        el.classList.toggle("over", tot>pot);
      }
    };
  });

  scope.querySelectorAll("[data-setrung]").forEach(function(btn){
    btn.onclick=async function(){
      var p=btn.getAttribute("data-setrung").split("|");
      var ex=p[0], rung=p[1];
      var mine={rung:rung}; setLocalPick(ex,mine);
      paintExercise(ex);
      await savePick(ex,mine);
    };
  });
}

  app.innerHTML=html;

  document.getElementById("nav").innerHTML=renderNav(h);
  var dd=document.getElementById("navdd"), ddb=document.getElementById("ddBtn"), ddp=document.getElementById("ddPanel");
  if(ddb){
    ddb.onclick=function(e){
      e.stopPropagation();
      var open=dd.getAttribute("data-open")==="1";
      dd.setAttribute("data-open",open?"0":"1");
      ddp.hidden=open;
      ddb.setAttribute("aria-expanded",open?"false":"true");

    });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!ddp.hidden){ dd.setAttribute("data-open","0"); ddp.hidden=true; } });
  }

  var gp=document.getElementById("goPresent");
  if(gp) gp.onclick=function(){ openPresent(gp.getAttribute("data-key")); };

  bind(app); paintAll(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
